<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - DulceFran</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>DulceFran</h1>
        <p>Mini donuts artesanales hechas con cariño</p>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li id="li-login"><a href="login.html">Iniciar sesión</a></li>
            <li id="li-registro"><a href="registro.html">Registrarse</a></li>
            <li><a href="carrito.html">Carrito 🛒 (<span id="contador-carrito">0</span>)</a></li>
        </ul>
    </nav>
    <main>
        <h2 class="titulo-pagina">Crea tu cuenta</h2>
        <form id="form-registro" class="formulario" novalidate>
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" required>
                <span id="nombre-error" class="error"></span>
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>
                <span id="correo-error" class="error"></span>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
                <span id="contrasena-error" class="error"></span>
            </div>

            <div class="campo">
                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar" name="confirmar" required>
                <span id="confirmar-error" class="error"></span>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono (opcional)</label>
                <input type="tel" id="telefono" name="telefono">
                <span id="telefono-error" class="error"></span>
            </div>

            <div class="campo">
                <label for="region">Región</label>
                <select id="region" name="region" required>
                    <option value="">Selecciona tu región</option>
                    <option>Arica y Parinacota</option>
                    <option>Tarapacá</option>
                    <option>Antofagasta</option>
                    <option>Atacama</option>
                    <option>Coquimbo</option>
                    <option>Valparaíso</option>
                    <option>Metropolitana</option>
                    <option>O'Higgins</option>
                    <option>Maule</option>
                    <option>Ñuble</option>
                    <option>Biobío</option>
                    <option>La Araucanía</option>
                    <option>Los Ríos</option>
                    <option>Los Lagos</option>
                    <option>Aysén</option>
                    <option>Magallanes</option>
                </select>
                <span id="region-error" class="error"></span>
            </div>

            <div class="campo">
                <label for="comuna">Comuna</label>
                <input type="text" id="comuna" name="comuna" maxlength="100" required>
                <span id="comuna-error" class="error"></span>
            </div>

            <p id="mensaje-registro" class="mensaje-confirmacion"></p>

            <button type="submit" class="boton">Registrarme</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 DulceFran - Mini donuts artesanales</p>
    </footer>

    <script src="assets/js/productos-data.js"></script>
    <script src="assets/js/carrito.js"></script>
    <script src="assets/js/usuarios.js"></script>
    <script src="assets/js/validaciones.js"></script>
    <script src="assets/js/sesion-nav.js"></script>
    <script src="assets/js/registro.js"></script>
</body>
</html>
